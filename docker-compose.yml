version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exameve-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-exameve}
      POSTGRES_USER: ${DB_USER:-exameve}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-exameve_dev_pass}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-exameve}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exameve-network

  redis:
    image: redis:7-alpine
    container_name: exameve-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exameve-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: exameve-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-exameve}:${DB_PASSWORD:-exameve_dev_pass}@postgres:5432/${DB_NAME:-exameve}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ML_SERVICE_URL: http://ml-service:8000
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exameve-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.dev
    container_name: exameve-ml-service
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      DEBUG: 'True'
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOG_LEVEL: INFO
    volumes:
      - ./ml-service:/app
    networks:
      - exameve-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: exameve-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_secret_change_in_production}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - exameve-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  exameve-network:
    driver: bridge

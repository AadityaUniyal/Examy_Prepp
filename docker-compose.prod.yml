version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: exameve-redis-prod
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exameve-network-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exameve-backend-prod
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ML_SERVICE_URL: http://ml-service:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - exameve-network-prod

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: exameve-ml-service-prod
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      DEBUG: 'False'
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOG_LEVEL: WARNING
    networks:
      - exameve-network-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exameve-frontend-prod
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
      GRAPHQL_URL_SERVER: http://backend:4000/graphql
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - exameve-network-prod

volumes:
  redis_prod_data:
    driver: local

networks:
  exameve-network-prod:
    driver: bridge
